[package]
name = "sintbot-desktop"
version = "0.1.6"
description = "SintBot for macOS"
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
tauri-plugin-updater = "2"
semver = "1"
libc = "0.2"
time = { version = "0.3", features = ["formatting"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = "symbols"
